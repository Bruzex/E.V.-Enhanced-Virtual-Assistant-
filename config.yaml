# =============================================================================
# E.V. (Enhanced Virtual Assistant) - Master Configuration
# Hardware Target: MSI Bravo 15 (8-16 GB RAM, AMD Radeon RX 6500M - 0 VRAM used)
# Strict Memory Ceiling: Peak RSS <= 4.0 GB | CPU-Only Execution (n_gpu_layers=0)
# Privacy Rule: Zero personal contacts, phone numbers, or user data in this file.
# =============================================================================

app:
  name: "E.V."
  full_name: "Enhanced Virtual Assistant"
  version: "3.4.0"
  log_level: "INFO"
  log_file: "logs/ev.log"

# -----------------------------------------------------------------------------
# 1. Local LLM Engine (Strictly CPU-only: n_gpu_layers MUST be 0)
# -----------------------------------------------------------------------------
llm:
  model_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
  n_gpu_layers: 0            # HARD MANDATE: 0 MB VRAM usage
  n_ctx: 1536                # Context window capped at 1536 tokens for <300 MB KV-cache
  n_threads: 6               # Physical CPU threads on Ryzen 5 5600H / 7535HS
  n_batch: 256
  temperature: 0.35
  top_p: 0.90
  repeat_penalty: 1.12
  max_tokens: 120            # Concise 1-3 sentence spoken responses
  code_max_tokens: 380       # Token budget when generating HTML/CSS/JS/React/Python code
  use_mmap: true             # OS memory-mapped weights
  use_mlock: false
  preload_on_startup: true
  system_prompt: >
    You are E.V. (Enhanced Virtual Assistant), created by Bruprog.
    Address the user as sir. Be concise (1 to 3 sentences for spoken replies).
    Never mention underlying model names.

# -----------------------------------------------------------------------------
# 2. RAM Guard & Resource Watchdog (Keep model resident under normal pressure)
# -----------------------------------------------------------------------------
ram_guard:
  max_process_rss_gb: 3.80
  warning_rss_gb: 3.40
  check_interval_seconds: 2.0
  unload_on_critical: false

# -----------------------------------------------------------------------------
# 3. Voice Pipeline (Faster-Whisper Primary CPU int8 + Vosk Fallback + Piper TTS)
# -----------------------------------------------------------------------------
voice:
  enabled: true
  vosk_model_path: "models/vosk-model-en-in-0.5"
  piper_binary_path: "models/piper/piper.exe"
  piper_voice_model: "models/piper/en_US-lessac-medium.onnx"
  piper_voice_config: "models/piper/en_US-lessac-medium.onnx.json"
  sample_rate: 16000
  block_size: 4000
  wake_words:
    - "hey evie"
    - "hey e.v."
    - "hey ev"
    - "evie"
    - "e.v."
    - "okay evie"
    - "ok evie"
    - "hi evie"
    - "hello evie"
  double_clap_enabled: true
  clap_min_rms: 0.14
  energy_threshold: 0.008
  barge_in_rms_threshold: 0.050
  silence_timeout_seconds: 1.1
  continuous_listening: true
  session_timeout_seconds: 90.0
  wake_chime_enabled: true
  stt:
    engine: "whisper"        # "whisper" (faster-whisper CPU int8) | "vosk" (automatic fallback)
    whisper_model: "base"    # "base" or "small"
    whisper_compute_type: "int8"
    min_confidence: 0.50
    partial_reset_seconds: 4.0
  tts:
    speaker_id: 0
    length_scale: 1.00
    noise_scale: 0.667
    noise_w: 0.80

# -----------------------------------------------------------------------------
# 4. Audio Routing (VB-Audio Virtual Cable for Phone Call Bridge)
# -----------------------------------------------------------------------------
audio_routing:
  vb_cable_input_hint: "CABLE Input"
  vb_cable_output_hint: "CABLE Output"
  auto_route_calls: true

# -----------------------------------------------------------------------------
# 5. Holographic HUD GUI (PyQt6 Frameless Overlay)
# -----------------------------------------------------------------------------
gui:
  enabled: true
  fullscreen_default: true
  width: 1440
  height: 900
  fps_limit: 30
  always_on_top: false
  opacity: 0.96
  telemetry_interval_ms: 1000
  default_countdown_seconds: 10

# -----------------------------------------------------------------------------
# 6. Workspaces, Safety & System Automation
# -----------------------------------------------------------------------------
security:
  require_confirmation_for_messages: false
  require_confirmation_for_calls: false

automation:
  workspaces_dir: "workspaces"
  screenshots_dir: "data/screenshots"
  code_workspace_dir: "data/workspace/code"
  launch_stagger_seconds: 0.35
  web_search:
    enabled: true
    max_results: 3
    region: "wt-wt"
    safesearch: "moderate"
    timeout_seconds: 4.0

# -----------------------------------------------------------------------------
# 7. Remote Control Bridges (WhatsApp Web & Wireless/USB ADB)
#    All personal contacts are stored in SQLite (data/memory.db), never here.
# -----------------------------------------------------------------------------
remote:
  whatsapp:
    enabled: false
    headless: true
    chrome_profile_dir: "data/chrome_whatsapp_profile"
    poll_interval_seconds: 5.0
  phone_adb:
    enabled: true
    host: "192.168.1.105"
    port: 5555
    adb_binary: "adb"
    connect_timeout_seconds: 3.0
    unlock_pin: ""

# -----------------------------------------------------------------------------
# 8. Long-Term Memory (SQLite3 + ChromaDB Vector RAG)
# -----------------------------------------------------------------------------
memory:
  enabled: true
  sqlite_path: "data/memory.db"
  chroma_dir: "data/chroma"
  collection_name: "ev_long_term_memory"
  top_k: 3
  max_history_turns: 20
